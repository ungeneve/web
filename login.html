<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول الآمن | UNGDR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDark: '#0A192F', // الأزرق الملكي الداكن [cite: 9]
                        deepRed: '#A61C1C',  // الأحمر القاني [cite: 10]
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center relative overflow-hidden">

    <div class="absolute top-0 right-0 w-64 h-64 bg-navyDark transform rotate-45 translate-x-24 -translate-y-24 opacity-10"></div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden z-10 border-t-4 border-deepRed">
        <div class="p-8">
            <div class="text-center mb-8">
                <img src="logo.png" alt="UNGDR Logo" class="mx-auto h-24 mb-4">
                <h2 class="text-2xl font-bold text-navyDark">بوابة الإدارة المركزية</h2>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">نظام تسجيل الدخول الموحد</p>
            </div>

            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-deepRed text-sm rounded-lg text-center font-bold border border-red-200">
                خطأ: اسم المستخدم أو كلمة المرور غير صحيحة!
            </div>

            <form id="loginForm" onsubmit="validateAccess(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-navyDark mb-2">اسم المستخدم</label>
                    <input type="text" id="userInput" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-navyDark outline-none transition" placeholder="أدخل اسم المستخدم">
                </div>
                <div>
                    <label class="block text-sm font-bold text-navyDark mb-2">كلمة المرور</label>
                    <input type="password" id="passInput" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-navyDark outline-none transition" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full bg-navyDark hover:bg-opacity-90 text-white font-bold py-3 rounded-lg shadow-lg transition transform hover:-translate-y-0.5">
                    تأقيق الهوية والدخول
                </button>
            </form>
        </div>
        
        <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
            <a href="index.html" class="text-sm text-navyDark hover:text-deepRed transition">← العودة لصفحة الموقع الرئيسية</a>
        </div>
    </div>

    <script>
        // تعريف مستخدمي النظام المعتمدين (قاعدة بيانات مصغرة)
        const authorizedUsers = [
            { user: "arwa", pass: "123", role: "أروى أبوقادوس" },
            { user: "hr", pass: "456", role: "مدير شؤون الموظفين" },
            { user: "v", pass: "ab12", role: "منسق المتطوعين" }
        ];

        function validateAccess(event) {
            event.preventDefault();
            
            const enteredUser = document.getElementById('userInput').value;
            const enteredPass = document.getElementById('passInput').value;
            const errorDiv = document.getElementById('errorMessage');

            // البحث عن المستخدم في القائمة
            const account = authorizedUsers.find(u => u.user === enteredUser && u.pass === enteredPass);

            if (account) {
                errorDiv.classList.add('hidden');
                alert(`تم التحقق بنجاح. مرحباً بك يا ${account.role}`);
                // التوجيه لصفحة لوحة التحكم
                window.location.href = "dashboard.html";
            } else {
                // إظهار رسالة الخطأ
                errorDiv.classList.remove('hidden');
                // مسح حقل كلمة المرور فقط للأمان
                document.getElementById('passInput').value = "";
            }
        }
    </script>

</body>
</html>
