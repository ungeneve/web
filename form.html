<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم لفريقنا - UNGDR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .brand-navy { background-color: #001f3f; } /* الأزرق الداكن المستوحى من الشعار */
        .brand-red { background-color: #a91d1d; }  /* الأحمر القاني للتميز */
        .text-brand-navy { color: #001f3f; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header Section -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center px-8 border-b-4 border-red-700">
        <img src="logo.png" alt="UNGDR Logo" class="h-16">
        <div class="hidden md:block text-brand-navy font-bold text-xl uppercase tracking-widest">
            United Geneve For Disaster Response
        </div>
    </header>

    <!-- Hero Image Section -->
    <div class="relative h-64 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1593113598332-cd288d649433?q=80&w=2070" class="w-full h-full object-cover brightness-50" alt="Team Action" class="w-full h-full object-cover opacity-80">
        <div class="absolute inset-0 bg-blue-900/40 flex items-center justify-center">
            <h1 class="text-white text-4xl font-bold bg-black/30 px-6 py-2 rounded">كن جزءاً من التغيير</h1>
        </div>
    </div>

    <!-- Form Section -->
    <main class="max-w-4xl mx-auto my-10 bg-white p-8 rounded-lg shadow-xl border-t-8 border-navy-900">
        <h2 class="text-2xl font-bold text-brand-navy mb-6 border-b-2 border-red-600 pb-2">نموذج طلب تطوع</h2>
        
        <form action="#" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Personal Info -->
            <div class="flex flex-col">
                <label class="mb-2 font-semibold text-gray-700">الاسم الكامل</label>
                <input type="text" placeholder="أدخل اسمك الثلاثي" class="p-3 border rounded-md focus:ring-2 focus:ring-blue-800 outline-none">
            </div>

            <div class="flex flex-col">
                <label class="mb-2 font-semibold text-gray-700">البريد الإلكتروني</label>
                <input type="email" placeholder="example@mail.com" class="p-3 border rounded-md focus:ring-2 focus:ring-blue-800 outline-none text-left">
            </div>

            <div class="flex flex-col">
                <label class="mb-2 font-semibold text-gray-700">التخصص / المهارة</label>
                <select class="p-3 border rounded-md focus:ring-2 focus:ring-blue-800 outline-none">
                    <option>إغاثة ميدانية</option>
                    <option>دعم طبي</option>
                    <option>لوجستيات وتخطيط</option>
                    <option>إعلام وتوثيق</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="mb-2 font-semibold text-gray-700">رقم التواصل</label>
                <input type="tel" placeholder="+966 5..." class="p-3 border rounded-md focus:ring-2 focus:ring-blue-800 outline-none text-left">
            </div>

            <div class="md:col-span-2 flex flex-col">
                <label class="mb-2 font-semibold text-gray-700">لماذا ترغب في الانضمام إلى UNGDR؟</label>
                <textarea rows="4" class="p-3 border rounded-md focus:ring-2 focus:ring-blue-800 outline-none" placeholder="اكتب نبذة قصيرة عن دوافعك..."></textarea>
            </div>

            <!-- Submit Button (CTA) -->
            <div class="md:col-span-2 text-center mt-4">
                <button type="submit" class="brand-red hover:bg-red-800 text-white font-bold py-4 px-12 rounded-full transition duration-300 transform hover:scale-105 shadow-lg">
                    إرسال طلب الانضمام
                </button>
            </div>
        </form>
    </main>

    <footer class="brand-navy text-white py-8 text-center">
        <p class="text-sm opacity-70">© 2026 UNGDR - جميع الحقوق محفوظة</p>
        <p class="text-xs mt-2 tracking-widest uppercase">Geneve In Action</p>
    </footer>

</body>
</html>
